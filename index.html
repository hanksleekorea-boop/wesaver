<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서비스 연결 상태 미확인</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 1rem; min-height: 100dvh; display: grid; place-items: center; }
    main { background: #1e293b; padding: clamp(1rem, 5vw, 3rem); border-radius: 12px; width: 100%; max-width: 42rem; overflow-wrap: anywhere; }
    h1 { color: #fbbf24; font-size: 1.6rem; }
    p { line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>서비스 연결 상태 미확인</h1>
    <p id="status" role="status" aria-live="polite">이 화면은 준비용 안내 화면입니다. 서버 연결이나 기능 동작을 검사하지 않았습니다.</p>
    <p>화면이 열린 것만으로 로그인, AI 처리, API 또는 웹훅이 정상 작동한다고 판단할 수 없습니다. 실제 서비스 진입점과 실행 증거를 확인해야 합니다.</p>
  </main>
</body>
</html>
